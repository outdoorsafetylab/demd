steps:
- name: gcr.io/cloud-builders/gcloud
  entrypoint: 'bash'
  args: [ '-c', "gcloud secrets versions access latest --secret=dockerhub_access_token --format='get(payload.data)' | tr '_-' '/+' | base64 -d > dockerhub_password" ]
- name: gcr.io/cloud-builders/docker
  entrypoint: 'bash'
  args: [ '-c', 'docker login --username=$$USERNAME --password-stdin < dockerhub_password']
  secretEnv: ['USERNAME']
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - --build-arg
  - GIT_HASH=$SHORT_SHA
  - --build-arg
  - GIT_TAG=$TAG_NAME
  - -t
  - outdoorsafetylab/demd
  - -f
  - Dockerfile
  - .
- name: gcr.io/cloud-builders/docker
  args:
  - tag
  - outdoorsafetylab/demd
  - outdoorsafetylab/demd:$TAG_NAME
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - outdoorsafetylab/demd
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - outdoorsafetylab/demd:$TAG_NAME
# The image is built from source on Ubuntu 24.04: two apt stages pulling
# libgdal-dev, plus the end-to-end suite running in the builder. That is
# comfortably past Cloud Build's 10 minute default on a stock worker.
timeout: 2400s

availableSecrets:
   secretManager:
   - versionName: projects/outdoorsafetylab/secrets/dockerhub_username/versions/latest
     env: USERNAME
